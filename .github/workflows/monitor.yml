name: Davidson course monitor

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test push before the normal course check
        type: boolean
        default: false

# All refs and manual/scheduled runs share this lock. Never cancel a delivery.
concurrency:
  group: davidson-course-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check courses and optionally send test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST: ${{ inputs.test_notification || false }}
        run: |
          args=()
          if [[ "$SEND_TEST" == "true" ]]; then
            args+=(--test-notification)
          fi
          python monitor.py "${args[@]}"
